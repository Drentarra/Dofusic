[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".portable-build", "Release", "Audit", "Models"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["dofusic", "tools"]
