name: Prepare independent music pack

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish music-v1 (requires prior user approval)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: music-v1
  cancel-in-progress: false

jobs:
  music-pack:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11.9 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Download verified source and build deterministic music pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'music-source'
          New-Item -ItemType Directory -Path $sourceDir | Out-Null
          gh release download v1.0.1 --repo $env:GITHUB_REPOSITORY --pattern Dofusic.zip --dir $sourceDir
          if ($LASTEXITCODE -ne 0) { throw 'Source release download failed' }
          New-Item -ItemType Directory -Path music-pack | Out-Null
          python .github/scripts/music_pack.py "$sourceDir/Dofusic.zip" music-pack/Dofusic-Musiques-v1.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source integrity validation or music pack generation failed' }
          $metadata = Get-Content Data/music-pack.json -Raw | ConvertFrom-Json
          if ($metadata.tag -cne 'music-v1' -or $metadata.asset -cne 'Dofusic-Musiques-v1.zip' -or $metadata.sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Invalid music pack metadata'
          }
          $digest = (Get-FileHash music-pack/Dofusic-Musiques-v1.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $metadata.sha256) { throw 'Generated pack differs from pinned metadata' }
          $checksum = [System.IO.File]::ReadAllText((Join-Path $pwd 'music-pack/Dofusic-Musiques-v1.zip.sha256'))
          if ($checksum -cne "$digest  Dofusic-Musiques-v1.zip`n") { throw 'Checksum companion differs from archive digest' }
          Write-Host "Verified music pack SHA256: $digest"

      - name: Upload reviewable music pack artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-Musiques-v1
          path: |
            music-pack/Dofusic-Musiques-v1.zip
            music-pack/Dofusic-Musiques-v1.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish immutable music-v1 only after approval
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $errorFile = Join-Path $env:RUNNER_TEMP 'music-release-view-error.txt'
          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/music-v1" 2> $errorFile
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0) { throw 'music-v1 already exists; immutable release will not be overwritten' }
          $failure = Get-Content $errorFile -Raw
          if ($failure -notmatch 'HTTP 404') { throw "Cannot determine release absence: $failure" }
          gh release create music-v1 music-pack/Dofusic-Musiques-v1.zip music-pack/Dofusic-Musiques-v1.zip.sha256 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Dofusic Musiques v1' --notes 'Independent immutable music pack from verified Dofusic v1.0.1.' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Music release creation failed' }
          $publishedDir = Join-Path $env:RUNNER_TEMP 'published-music-pack'
          New-Item -ItemType Directory -Path $publishedDir | Out-Null
          gh release download music-v1 --repo $env:GITHUB_REPOSITORY --pattern 'Dofusic-Musiques-v1.zip*' --dir $publishedDir
          if ($LASTEXITCODE -ne 0) { throw 'Published asset verification download failed' }
          $metadata = Get-Content Data/music-pack.json -Raw | ConvertFrom-Json
          $publishedDigest = (Get-FileHash "$publishedDir/Dofusic-Musiques-v1.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publishedDigest -cne $metadata.sha256) { throw 'Published asset digest differs from pinned metadata' }
          $publishedChecksum = [System.IO.File]::ReadAllText("$publishedDir/Dofusic-Musiques-v1.zip.sha256")
          if ($publishedChecksum -cne "$publishedDigest  Dofusic-Musiques-v1.zip`n") { throw 'Published checksum companion is invalid' }
          Write-Host "Published GitHub asset SHA256 verified: $publishedDigest"
