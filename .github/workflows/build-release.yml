name: Build and release Dofusic

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MUSIC_SOURCE_TAG: v1.0.0
  MUSIC_SOURCE_ASSET: Dofusic.zip

jobs:
  build-windows:
    name: Build Windows portable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: 3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            Data/requirements.txt
            Data/requirements-build.txt

      - name: Download bundled music pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:MUSIC_SOURCE_TAG/$env:MUSIC_SOURCE_ASSET"
          $zip = Join-Path $env:RUNNER_TEMP "dofusic-music-source.zip"
          $extract = Join-Path $env:RUNNER_TEMP "dofusic-music-source"

          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $musicSource = Join-Path $extract "Dofusic\Musiques"
          if (-not (Test-Path $musicSource)) {
            throw "Dossier Musiques introuvable dans $env:MUSIC_SOURCE_ASSET"
          }

          if (Test-Path "Musiques") { Remove-Item "Musiques" -Recurse -Force }
          Copy-Item $musicSource "Musiques" -Recurse

          $musicFiles = @(Get-ChildItem "Musiques" -File -Recurse)
          if ($musicFiles.Count -eq 0) { throw "Le pack Musiques est vide" }
          Write-Host "[OK] Musiques copiees : $($musicFiles.Count) fichiers"

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r Data/requirements.txt -r Data/requirements-build.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d, 'opencv-python installe en doublon'; assert 'opencv-python-headless' in d, 'opencv-python-headless absent'"

      - name: Build and test portable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python Data/tools/build_portable.py --root .

      - name: Prepare and verify public ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "Release\Dofusic_V25_1_ECO_WINDOWS_X64.zip"
          $target = "Release\Dofusic.zip"

          if (-not (Test-Path $source)) { throw "Archive generee introuvable: $source" }
          Copy-Item $source $target -Force

          $verify = Join-Path $env:RUNNER_TEMP "dofusic-final-check"
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          Expand-Archive -Path $target -DestinationPath $verify -Force

          $root = Join-Path $verify "Dofusic"
          if (-not (Test-Path (Join-Path $root "Dofusic.exe"))) { throw "Dofusic.exe absent du ZIP final" }
          if (-not (Test-Path (Join-Path $root "Data"))) { throw "Data absent du ZIP final" }
          if (-not (Test-Path (Join-Path $root "Musiques"))) { throw "Musiques absent du ZIP final" }

          $musicFiles = @(Get-ChildItem (Join-Path $root "Musiques") -File -Recurse)
          if ($musicFiles.Count -eq 0) { throw "Musiques est vide dans le ZIP final" }

          $hash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          "$hash  Dofusic.zip" | Set-Content -Encoding ascii "Release\Dofusic.zip.sha256"
          Write-Host "[OK] ZIP final verifie - $($musicFiles.Count) musiques - SHA256 $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Dofusic-Windows-x64-${{ github.ref_name }}
          path: |
            Release/Dofusic.zip
            Release/Dofusic.zip.sha256
            Release/BUILD_SIZE_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --title "Dofusic $tag" --generate-notes --latest
          }

          gh release upload $tag `
            "Release\Dofusic.zip" `
            "Release\Dofusic.zip.sha256" `
            "Release\BUILD_SIZE_REPORT.txt" `
            --repo $repo `
            --clobber
