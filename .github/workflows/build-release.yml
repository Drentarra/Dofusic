name: Build and release Dofusic

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag existant à publier (ex. v1.2.3). Vide : construire et vérifier uniquement, sans publier.'
        required: false
        default: ''
        type: string
      create_tag_from_main:
        description: 'Créer le tag depuis le commit vérifié de main, puis publier. À cocher pour une nouvelle version.'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/release-requests/v2.0.0.txt"

permissions: {}

concurrency:
  group: dofusic-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows portable
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Validate requested release tag
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          import os
          import re
          if not re.fullmatch(r'v[A-Za-z0-9][A-Za-z0-9._-]*', os.environ['RELEASE_TAG']):
              raise ValueError('Expected a release tag such as v1.2.3')

      - name: Validate new release request
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag_from_main
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          import os
          if not os.environ['RELEASE_TAG']:
              raise ValueError('Indiquez le tag de la nouvelle version, par exemple v1.2.3')
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise ValueError('La création d’un nouveau tag est autorisée uniquement depuis main')

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.create_tag_from_main && github.sha || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref) }}

      - name: Verify one-time v2.0.0 release request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path
          assert Path('.github/release-requests/v2.0.0.txt').read_text(encoding='utf-8').strip() == 'v2.0.0'
          version = Path('Data/dofusic/version.py').read_text(encoding='utf-8')
          assert '__version__ = "2.0.0"' in version

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: Data/requirements-lock.txt

      - name: Check release tag matches application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          $ErrorActionPreference = "Stop"
          python Data/tools/check_release_tag.py $env:RELEASE_TAG

      - name: Install locked build dependencies and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r Data/requirements-lock.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d, 'opencv-python installed in conflict'; assert 'opencv-python-headless' in d, 'opencv-python-headless missing'"
          python -m pytest -q

      - name: Build and test portable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/build_portable.py --root . --skip-tests

      - name: Prepare public ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = (Get-Content -LiteralPath "Release/PORTABLE_ARCHIVE_NAME.txt" -Raw).Trim()
          if ($name -notmatch '^Dofusic_[0-9]+\.[0-9]+\.[0-9]+_LOCAL_WINDOWS_X64_AVEC_MUSIQUES\.zip$') { throw "Invalid portable artifact name: $name" }
          $source = Join-Path 'Release' $name
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Generated archive missing: $source" }
          Copy-Item -LiteralPath $source -Destination "Release/Dofusic.zip"

      - name: Generate and validate installed build environment SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $buildPython = (python -c "import sys; from pathlib import Path; print(Path(sys.executable).resolve())").Trim()
          if (-not [System.IO.Path]::IsPathFullyQualified($buildPython)) { throw "Build Python path must be absolute" }
          python -m venv .sbom-venv
          & ./.sbom-venv/Scripts/python.exe -m pip install cyclonedx-bom==7.3.1
          & ./.sbom-venv/Scripts/python.exe -m cyclonedx_py environment $buildPython --output-reproducible --spec-version 1.6 --output-format JSON --output-file Release/Dofusic.sbom.json
          python .github/scripts/verify_release.py sbom Release/Dofusic.sbom.json Data/requirements-lock.txt

      - name: Transfer build to verification job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: INTERNAL-Dofusic-release-candidate
          path: |
            Release/Dofusic.zip
            Release/BUILD_SIZE_REPORT.txt
            Release/BUILD_PROVENANCE.json
            Release/Dofusic.sbom.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-windows:
    name: Verify and publish release
    needs: build-windows
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.create_tag_from_main && github.sha || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref) }}

      - name: Verify one-time v2.0.0 release request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          from pathlib import Path
          assert Path('.github/release-requests/v2.0.0.txt').read_text(encoding='utf-8').strip() == 'v2.0.0'
          version = Path('Data/dofusic/version.py').read_text(encoding='utf-8')
          assert '__version__ = "2.0.0"' in version

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Download release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: INTERNAL-Dofusic-release-candidate
          path: Release

      - name: Verify final public ZIP and compute SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/verify_release.py final Release/Dofusic.zip Release/Dofusic.zip.sha256
          python .github/scripts/verify_release.py music-source Release/Dofusic.zip Musiques
          python .github/scripts/verify_release.py provenance Release/Dofusic.zip . Release/BUILD_PROVENANCE.json
          if (-not (Test-Path -LiteralPath "Release/BUILD_SIZE_REPORT.txt" -PathType Leaf)) { throw "Build size report missing" }

      - name: Validate transferred build environment SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/verify_release.py sbom Release/Dofusic.sbom.json Data/requirements-lock.txt

      - name: Attest final public ZIP
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: Release/Dofusic.zip
          create-storage-record: false

      - name: Upload verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-Windows-x64-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'v2.0.0' || inputs.release_tag || github.ref_name }}
          path: Release/Dofusic.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create verified release tag from main
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag_from_main || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'v2.0.0' || inputs.release_tag }}
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # This happens only after the ZIP, SBOM, checksums, and provenance pass.
          # GitHub's GITHUB_TOKEN does not trigger a second tag-push workflow.
          gh api -X POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:VERIFIED_COMMIT"
          if ($LASTEXITCODE -ne 0) { throw "Le tag existe déjà ou sa création a échoué." }

      - name: Publish GitHub release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'v2.0.0' || inputs.release_tag || github.ref_name }}
        run: |
          import os
          import subprocess
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          request = Request(
              f'https://api.github.com/repos/{repo}/releases/tags/{quote(tag, safe="")}',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Dofusic-release-workflow',
              },
          )
          try:
              with urlopen(request, timeout=30):
                  exists = True
          except HTTPError as error:
              if error.code != 404:
                  raise
              exists = False

          if exists:
              subprocess.run([
                  'gh', 'release', 'upload', tag, '--repo', repo,
                  'Release/Dofusic.zip', '--clobber',
              ], check=True)
              subprocess.run([
                  'gh', 'release', 'edit', tag, '--repo', repo,
                  '--draft=false', '--latest',
              ], check=True)
          else:
              notes_file = f'.github/RELEASE_NOTES_{tag}.md'
              notes_args = (
                  ['--notes-file', notes_file]
                  if os.path.isfile(notes_file) else ['--generate-notes']
              )
              subprocess.run([
                  'gh', 'release', 'create', tag, '--repo', repo, '--verify-tag',
                  '--title', f'Dofusic {tag}', *notes_args, '--latest',
                  'Release/Dofusic.zip',
              ], check=True)
