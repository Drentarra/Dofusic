name: Build and release Dofusic

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag existant à compiler et publier (ex. v1.0.6). Vide : compilation seule.'
        required: false
        default: ''
        type: string
  push:
    branches:
      - "release/v*"
      - "rebuild/v*"
    tags:
      - "v*"

permissions: {}

concurrency:
  group: dofusic-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows portable
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Validate requested release tag
        id: release
        shell: python
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          import os
          import re
          tag = os.environ['RELEASE_TAG']
          ref = os.environ.get('RELEASE_REF', '')
          source_ref = os.environ['SOURCE_SHA']
          rebuild = ref.startswith('refs/heads/rebuild/')
          if ref.startswith('refs/heads/release/'):
              tag = ref.removeprefix('refs/heads/release/')
          elif rebuild:
              tag = ref.removeprefix('refs/heads/rebuild/')
          elif ref.startswith('refs/tags/v'):
              tag = ref.removeprefix('refs/tags/')
          if tag and not re.fullmatch(r'v[A-Za-z0-9][A-Za-z0-9._-]*', tag):
              raise ValueError('Expected a release tag such as v1.0.6')
          if rebuild or os.environ['RELEASE_TAG']:
              source_ref = f'refs/tags/{tag}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'source_ref={source_ref}\nrelease_tag={tag}\n')

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.source_ref }}

      - name: Record built source commit
        id: source
        shell: python
        run: |
          import os
          import subprocess
          sha = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True).stdout.strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'sha={sha}\n')

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: Data/requirements-lock.txt

      - name: Install locked build dependencies and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r Data/requirements-lock.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d, 'opencv-python installed in conflict'; assert 'opencv-python-headless' in d, 'opencv-python-headless missing'"
          python -m pytest -q

      - name: Build and test portable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/build_portable.py --root .

      - name: Prepare public ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "Release/Dofusic_V25_1_ECO_WINDOWS_X64.zip"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Generated archive missing: $source" }
          Copy-Item -LiteralPath $source -Destination "Release/Dofusic.zip"

      - name: Transfer build to verification job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-release-candidate
          path: |
            Release/Dofusic.zip
            Release/BUILD_SIZE_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release-windows:
    name: Verify and publish release
    needs: build-windows
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.build-windows.outputs.source_sha }}

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Download release candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Dofusic-release-candidate
          path: Release

      - name: Install SBOM validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r Data/requirements-lock.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d; assert 'opencv-python-headless' in d"

      - name: Verify final public ZIP and compute SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/verify_release.py final Release/Dofusic.zip Release/Dofusic.zip.sha256
          if (-not (Test-Path -LiteralPath "Release/BUILD_SIZE_REPORT.txt" -PathType Leaf)) { throw "Build size report missing" }

      - name: Generate and validate installed build environment SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $buildPython = (python -c "import sys; from pathlib import Path; print(Path(sys.executable).resolve())").Trim()
          if (-not [System.IO.Path]::IsPathFullyQualified($buildPython)) { throw "Build Python path must be absolute" }
          python -m venv .sbom-venv
          & ./.sbom-venv/Scripts/python.exe -m pip install cyclonedx-bom==7.3.1
          & ./.sbom-venv/Scripts/python.exe -m cyclonedx_py environment $buildPython --output-reproducible --spec-version 1.6 --output-format JSON --output-file Release/Dofusic.sbom.json
          python .github/scripts/verify_release.py sbom Release/Dofusic.sbom.json Data/requirements-lock.txt

      - name: Bind release branch tag to built source
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          import json
          import os
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_REF'].removeprefix('refs/heads/release/')
          if not re.fullmatch(r'v[A-Za-z0-9][A-Za-z0-9._-]*', tag):
              raise ValueError('Expected a release tag such as v1.0.10')
          source_sha = subprocess.run(
              ['git', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True,
          ).stdout.strip()
          request = Request(
              f'https://api.github.com/repos/{repo}/git/ref/tags/{quote(tag, safe="")}',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Dofusic-release-workflow',
              },
          )
          try:
              with urlopen(request, timeout=30) as response:
                  existing = json.load(response)['object']
          except HTTPError as error:
              if error.code != 404:
                  raise
              existing = None

          if existing is None:
              subprocess.run([
                  'gh', 'api', f'repos/{repo}/git/refs', '--method', 'POST',
                  '-f', f'ref=refs/tags/{tag}', '-f', f'sha={source_sha}',
              ], check=True)
          elif existing.get('type') != 'commit' or existing.get('sha') != source_sha:
              raise ValueError('Release tag points to different source')

      - name: Attest final public ZIP
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/rebuild/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: Release/Dofusic.zip
          create-storage-record: false

      - name: Upload verification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-Windows-x64-${{ github.run_id }}
          path: |
            Release/Dofusic.zip
            Release/Dofusic.zip.sha256
            Release/Dofusic.sbom.json
            Release/BUILD_SIZE_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/rebuild/')
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          import os
          import subprocess
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['GH_REPO']
          tag = os.environ['RELEASE_TAG']
          ref = os.environ.get('RELEASE_REF', '')
          if ref.startswith('refs/heads/release/'):
              tag = ref.removeprefix('refs/heads/release/')
          elif ref.startswith('refs/heads/rebuild/'):
              tag = ref.removeprefix('refs/heads/rebuild/')
          notes = (
              'Portable Windows compilé, testé et attesté par GitHub Actions.\n\n'
              f'- [Code source de cette version](https://github.com/{repo}/tree/{tag})\n'
              f'- [Compilation GitHub Actions](https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]})\n\n'
              'Dossier Musiques inclus à côté de Dofusic.exe, comme dans les releases précédentes.'
          )
          request = Request(
              f'https://api.github.com/repos/{repo}/releases/tags/{quote(tag, safe="")}',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Dofusic-release-workflow',
              },
          )
          try:
              with urlopen(request, timeout=30):
                  exists = True
          except HTTPError as error:
              if error.code != 404:
                  raise
              exists = False

          if exists:
              subprocess.run([
                  'gh', 'release', 'upload', tag, '--repo', repo,
                  'Release/Dofusic.zip', '--clobber',
              ], check=True)
              edit = ['gh', 'release', 'edit', tag, '--repo', repo, '--draft=false', '--latest']
              if ref.startswith('refs/heads/rebuild/'):
                  edit += ['--notes', notes]
              subprocess.run(edit, check=True)
          else:
              subprocess.run([
                  'gh', 'release', 'create', tag, '--repo', repo, '--verify-tag',
                  '--title', f'Dofusic {tag}', '--notes', notes, '--generate-notes', '--latest',
                  'Release/Dofusic.zip',
              ], check=True)
