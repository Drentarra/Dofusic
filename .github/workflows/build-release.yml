name: Build and release Dofusic

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-windows:
    name: Build Windows portable
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
          cache-dependency-path: Data/requirements-lock.txt

      - name: Download and verify immutable music pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $metadata = Get-Content -LiteralPath "Data/music-pack.json" -Raw | ConvertFrom-Json
          if ($metadata.tag -ne "music-v1" -or $metadata.asset -ne "Dofusic-Musiques-v1.zip" -or $metadata.sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw "Invalid pinned music pack metadata"
          }
          $download = Join-Path $env:RUNNER_TEMP ("music-download-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $metadata.tag --repo $env:GH_REPO --pattern $metadata.asset --dir $download
          $zip = Join-Path $download $metadata.asset
          $extract = Join-Path $env:RUNNER_TEMP ("music-verified-" + [guid]::NewGuid())
          python .github/scripts/verify_release.py music $zip $metadata.sha256 $extract
          if (Test-Path -LiteralPath "Musiques") { throw "Musiques already exists in clean checkout" }
          Move-Item -LiteralPath (Join-Path $extract "Musiques") -Destination "Musiques"

      - name: Install locked build dependencies and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r Data/requirements-lock.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d, 'opencv-python installed in conflict'; assert 'opencv-python-headless' in d, 'opencv-python-headless missing'"
          python -m pytest -q

      - name: Build and test portable version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/build_portable.py --root .

      - name: Prepare unsigned public ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $source = "Release/Dofusic_V25_1_ECO_WINDOWS_X64.zip"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "Generated archive missing: $source" }
          Copy-Item -LiteralPath $source -Destination "Release/Dofusic.zip"

      - name: Transfer unsigned ZIP to signing job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-unsigned-candidate
          path: |
            Release/Dofusic.zip
            Release/BUILD_SIZE_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sign-windows:
    name: Sign Windows portable ZIP
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.signpath-config.outputs.enabled }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Download unsigned ZIP
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Dofusic-unsigned-candidate
          path: Release
      - name: Validate official tag signing configuration
        id: signpath-config
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_REQUIRED: ${{ vars.SIGNPATH_REQUIRED }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $required = $env:SIGNPATH_REQUIRED
          if (-not [string]::IsNullOrEmpty($required) -and $required -cne 'true' -and $required -cne 'false') { throw "SIGNPATH_REQUIRED must be exactly true or false" }
          $configuration = @($env:SIGNPATH_API_TOKEN, $env:SIGNPATH_ORGANIZATION_ID, $env:SIGNPATH_PROJECT_SLUG, $env:SIGNPATH_SIGNING_POLICY_SLUG, $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG)
          $supplied = @($configuration | Where-Object { -not [string]::IsNullOrEmpty($_) }).Count
          $missing = @($configuration | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count
          if ($supplied -eq 0 -and $required -cne 'true') { "enabled=false" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append }
          else {
            if ($missing -gt 0) { throw "Official tag signing requires complete SignPath configuration" }
            $signedDirectory = Join-Path $env:RUNNER_TEMP ("signpath-result-" + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $signedDirectory | Out-Null
            "enabled=true" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "signed-directory=$signedDirectory" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Upload exact unsigned ZIP for SignPath
        id: signpath-upload
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-signing-input
          path: Release/Dofusic.zip
          archive: false
          if-no-files-found: error
      - name: Sign official tag ZIP with SignPath
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.signpath-upload.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: ${{ steps.signpath-config.outputs.signed-directory }}
      - name: Validate signed ZIP and Authenticode
        if: steps.signpath-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          SIGNED_DIRECTORY: ${{ steps.signpath-config.outputs.signed-directory }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $signedZip = Join-Path $env:SIGNED_DIRECTORY "Dofusic.zip"
          if (-not (Test-Path -LiteralPath $signedZip -PathType Leaf)) { throw "Signed Dofusic.zip missing" }
          $extract = Join-Path $env:RUNNER_TEMP ("signpath-verified-" + [guid]::NewGuid())
          python .github/scripts/verify_release.py signed Release/Dofusic.zip $signedZip $extract
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $extract "Dofusic/Dofusic.exe")
          if ($signature.Status -ne 'Valid') { throw "Returned executable has no valid Authenticode signature" }
      - name: Transfer signed ZIP to final job
        if: steps.signpath-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-signed-candidate
          path: ${{ steps.signpath-config.outputs.signed-directory }}/Dofusic.zip
          if-no-files-found: error
          compression-level: 0

  release-windows:
    name: Attest and publish verified release
    needs: [build-windows, sign-windows]
    if: always() && needs.build-windows.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: windows-2025
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Download unsigned candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Dofusic-unsigned-candidate
          path: Release
      - name: Download signed candidate
        if: needs.sign-windows.outputs.signed == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Dofusic-signed-candidate
          path: Release/signed
      - name: Select signed candidate
        if: needs.sign-windows.outputs.signed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          Move-Item -LiteralPath Release/signed/Dofusic.zip -Destination Release/Dofusic.zip -Force
      - name: Install SBOM validation dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r Data/requirements-lock.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d; assert 'opencv-python-headless' in d"
      - name: Verify final public ZIP and compute SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python .github/scripts/verify_release.py final Release/Dofusic.zip Release/Dofusic.zip.sha256
          if (-not (Test-Path -LiteralPath "Release/BUILD_SIZE_REPORT.txt" -PathType Leaf)) { throw "Build size report missing" }
      - name: Generate and validate installed build environment SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $buildPython = (python -c "import sys; from pathlib import Path; print(Path(sys.executable).resolve())").Trim()
          if (-not [System.IO.Path]::IsPathFullyQualified($buildPython)) { throw "Build Python path must be absolute" }
          python -m venv .sbom-venv
          & ./.sbom-venv/Scripts/python.exe -m pip install cyclonedx-bom==7.3.1
          & ./.sbom-venv/Scripts/python.exe -m cyclonedx_py environment $buildPython --output-reproducible --spec-version 1.6 --output-format JSON --output-file Release/Dofusic.sbom.json
          python .github/scripts/verify_release.py sbom Release/Dofusic.sbom.json Data/requirements-lock.txt
      - name: Attest final public ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: Release/Dofusic.zip
          create-storage-record: false
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Dofusic-Windows-x64-${{ github.ref_name }}
          path: |
            Release/Dofusic.zip
            Release/Dofusic.zip.sha256
            Release/Dofusic.sbom.json
            Release/BUILD_SIZE_REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Create immutable GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --title "Dofusic $env:RELEASE_TAG" --generate-notes --latest "Release/Dofusic.zip" "Release/Dofusic.zip.sha256" "Release/Dofusic.sbom.json" "Release/BUILD_SIZE_REPORT.txt"
