name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  checks:
    name: Tests, runtime probes and portable build
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install locked dependencies and check OpenCV
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r Data/requirements-lock.txt
          python -m pip install --no-deps rapidocr==3.9.2
          python -c "import importlib.metadata as m; d={x.metadata.get('Name','').lower() for x in m.distributions()}; assert 'opencv-python' not in d, 'opencv-python installed twice'; assert 'opencv-python-headless' in d, 'opencv-python-headless missing'"
      - name: Check source hygiene
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements-dev.txt
          python -m ruff check .
      - name: Check soundtrack availability
        id: soundtrack
        shell: python
        run: |
          import os
          import runpy
          from pathlib import Path
          builder = runpy.run_path('Data/tools/build_portable.py')
          root = Path.cwd()
          available = builder['validate_source'](root, root / 'Data', require_music=False)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'available={str(available).lower()}\n')
          if not available:
              print('Source-only checkout: portable packaging skipped; all other checks remain required.')
      - name: Audit every Python source and test file
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/audit_sources.py --output Audit/source_inventory.json --summary Audit/SOURCES.md
      - name: Check all tracked assets and repository files
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/audit_repository.py --output Audit/repository_files.json --summary Audit/REPOSITORY.md
      - name: Test with branch coverage guard
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m coverage run --branch --source=dofusic -m pytest -q
          python -m coverage report --fail-under=55
          python -m coverage json -o Audit/coverage.json
      - name: Prepare checked OCR model
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import sys; sys.path.insert(0, 'Data'); from pathlib import Path; from tools.build_portable import prepare_ocr_models; prepare_ocr_models(Path('Data'))"
          python Data/tools/prepare_models.py
      - name: Probe required runtimes
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/runtime_probe.py
      - name: Probe OCR worker startup and shutdown
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/ocr_worker_probe.py
      - name: Benchmark current OCR, HUD and geographic resolver
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = (Resolve-Path "Data").Path
          python Data/tools/benchmark_runtime.py --db Data/dofus_data.sqlite --models Data/Models --output Audit/benchmark_current.json
          python Data/tools/check_benchmark.py Audit/benchmark_current.json
      - name: Report current algorithm complexity
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/complexity_report.py --root . --output Audit/complexity_current.json
      - name: Build portable control
        if: steps.soundtrack.outputs.available == 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python Data/tools/build_portable.py --root . --skip-tests
          Get-Content Release/BUILD_SIZE_REPORT.txt
      - name: Upload checks and available Windows portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Dofusic-portable-ci
          path: |
            Release/Dofusic_*_LOCAL_WINDOWS_X64_AVEC_MUSIQUES.zip
            Release/BUILD_SIZE_REPORT.txt
            Release/PORTABLE_ARCHIVE_NAME.txt
            Audit/benchmark_current.json
            Audit/complexity_current.json
            Audit/coverage.json
            Audit/source_inventory.json
            Audit/SOURCES.md
            Audit/repository_files.json
            Audit/REPOSITORY.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
